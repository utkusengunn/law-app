name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate a fresh Android scaffold matching this Flutter version
        run: |
          flutter create --platforms=android --project-name=law_app --org=com.utkusengun /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          echo "===== android/ tree (diagnostic) ====="
          find android -maxdepth 4 -type f | sort
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="law_app"/android:label="Avukat Asistan"/' "$MANIFEST"
          else
            echo "UYARI: $MANIFEST bulunamadı, label değiştirilemedi."
          fi

          # share_plus (v7.2.2) needs compileSdk 34+, but its OWN
          # android/build.gradle (inside the pub cache, not our repo)
          # hardcodes/resolves compileSdk 33 - editing app/build.gradle.kts
          # (tried in v0.6.1) or android/local.properties (tried in v0.6.2)
          # only affects OUR app module, never share_plus's own subproject,
          # and Flutter's "Upgrading build.gradle.kts" step reverts direct
          # edits to app/build.gradle.kts anyway. The only override point
          # that reaches EVERY subproject (app + every plugin, including
          # share_plus) is the root android/build.gradle(.kts)'s
          # `subprojects {}` block, applied after each subproject's own
          # config via afterEvaluate. Appended further down once we know
          # whether this scaffold is Kotlin DSL or Groovy.

      - name: Apply Firebase configuration to the fresh scaffold
        run: |
          cp firebase/google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            echo "Tespit: Kotlin DSL (settings.gradle.kts) kullanılıyor."
            SETTINGS=android/settings.gradle.kts
            sed -i '/org.jetbrains.kotlin.android/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
          elif [ -f android/settings.gradle ]; then
            echo "Tespit: Groovy DSL (settings.gradle) kullanılıyor."
            SETTINGS=android/settings.gradle
            sed -i '/org.jetbrains.kotlin.android/a\    id "com.google.gms.google-services" version "4.4.2" apply false' "$SETTINGS"
          else
            echo "HATA: ne settings.gradle ne de settings.gradle.kts bulundu."
            echo "===== android/ tam liste ====="
            find android -type f | sort
            exit 1
          fi

          if [ -f android/app/build.gradle.kts ]; then
            APPGRADLE=android/app/build.gradle.kts
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id("com.google.gms.google-services")' "$APPGRADLE"
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APPGRADLE"
            # share_plus (v7.2.2) pulls in androidx.window/fragment/activity/
            # lifecycle versions that require compiling against API 34+.
            # Flutter's `flutter.compileSdkVersion`/`flutter.targetSdkVersion`
            # defaults still resolved to 33 here, which failed
            # `:share_plus:checkReleaseAarMetadata`. Pin both explicitly.
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 35/' "$APPGRADLE"
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = 35/' "$APPGRADLE"
            # `flutter create --project-name=law_app --org=com.utkusengun` bakes
            # applicationId "com.utkusengun.law_app" (with the underscore) - but
            # the Firebase project (and google-services.json) was registered
            # for "com.utkusengun.lawapp" (no underscore). Force it to match.
            sed -i -E 's/applicationId[[:space:]]*=[[:space:]]*"com\.utkusengun\.law_app"/applicationId = "com.utkusengun.lawapp"/' "$APPGRADLE"
          elif [ -f android/app/build.gradle ]; then
            APPGRADLE=android/app/build.gradle
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id "com.google.gms.google-services"' "$APPGRADLE"
            sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APPGRADLE"
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 35/' "$APPGRADLE"
            sed -i -E 's/targetSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.targetSdkVersion/targetSdk = 35/' "$APPGRADLE"
            sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"com\.utkusengun\.law_app"/applicationId "com.utkusengun.lawapp"/' "$APPGRADLE"
          else
            echo "HATA: ne app/build.gradle ne de app/build.gradle.kts bulundu."
            exit 1
          fi
          echo "----- $APPGRADLE applicationId satırı -----"; grep -n applicationId "$APPGRADLE"

          echo "IS_KTS=$([ -f android/app/build.gradle.kts ] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "----- $SETTINGS -----"; cat "$SETTINGS"
          echo "----- $APPGRADLE -----"; cat "$APPGRADLE"

          # Force compileSdk 35 on every Android subproject (app AND every
          # plugin, share_plus included) - see the comment in the previous
          # step for why this is the only override point that actually
          # reaches share_plus's own subproject.
          if [ -f android/build.gradle.kts ]; then
            # NOTE: com.android.build.gradle.BaseExtension (used in a first
            # attempt at this fix) was REMOVED in AGP 9.0 - confirmed against
            # Google's own AGP 9.0 migration notes, which is why this uses
            # the current replacement (com.android.build.api.dsl.CommonExtension,
            # which as of AGP 9.0 no longer needs generic type parameters -
            # also confirmed against that same migration doc's own example).
            cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.api.dsl.CommonExtension::class.java)?.let { commonExtension ->
                      commonExtension.compileSdk = 35
                  }
              }
          }
          EOF
            echo "----- android/build.gradle.kts (root, after override) -----"; cat android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { proj ->
                  if (proj.hasProperty('android')) {
                      proj.android {
                          compileSdkVersion 35
                      }
                  }
              }
          }
          EOF
            echo "----- android/build.gradle (root, after override) -----"; cat android/build.gradle
          else
            echo "HATA: ne android/build.gradle ne de android/build.gradle.kts bulundu."
            exit 1
          fi

      - name: Configure consistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          echo "----- keystore dosya boyutu (bayt, 2794 olmalı) -----"
          wc -c < android/app/release-keystore.jks

          # Gerçek doğrulama: keytool -list yalnızca STORE şifresini kontrol
          # eder, KEY şifresini hiç dokunmaz - onu daha önce yanlışlıkla yeterli
          # sandık ve build yine de patladı. -importkeystore hem store hem key
          # şifresini gerçekten decrypt ederek dener, tam olarak Gradle'ın
          # paketleme sırasında yaptığının aynısı - bu yüzden asıl güvenilir test bu.
          echo "----- keystore + store/key şifre doğrulaması (gerçek decrypt testi) -----"
          if ! keytool -importkeystore \
              -srckeystore android/app/release-keystore.jks -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
              -destkeystore /tmp/verify.jks -deststorepass verify123456 -destkeypass verify123456 -destalias "$KEY_ALIAS" \
              -noprompt > /tmp/verify.log 2>&1; then
            echo "HATA: keystore/şifreler/alias uyuşmuyor. Aşağıdaki gerçek hatayı oku:"
            cat /tmp/verify.log
            echo ""
            echo "Kontrol et: GitHub Secrets'taki ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD değerlerinden biri eksik/yanlış kopyalanmış olabilir."
            exit 1
          fi
          echo "OK: keystore, store şifresi VE key şifresi doğrulandı (gerçek decrypt testiyle)."
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

          if [ "$IS_KTS" = "true" ]; then
            APPGRADLE=android/app/build.gradle.kts
            # Imports are allowed before the plugins {} block (Gradle's only
            # rule is that plugins {} must be the FIRST block, not the first
            # line), so put ours at the very top of the file.
            sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' "$APPGRADLE"
            # Load key.properties. The loading code itself must go AFTER the
            # plugins {} block, so insert right after its closing brace - the
            # first standalone "}" line following our two new import lines.
            sed -i '0,/^}/{/^}/a\
          val keystoreProperties = Properties()\
          val keystorePropertiesFile = rootProject.file("key.properties")\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }
          }' "$APPGRADLE"
            sed -i '/^android {/a\
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties.getProperty("keyAlias")\
                      keyPassword = keystoreProperties.getProperty("keyPassword")\
                      storeFile = file(keystoreProperties.getProperty("storeFile"))\
                      storePassword = keystoreProperties.getProperty("storePassword")\
                  }\
              }' "$APPGRADLE"
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$APPGRADLE"
          else
            APPGRADLE=android/app/build.gradle
            sed -i '0,/^}/{/^}/a\
          def keystoreProperties = new Properties()\
          def keystorePropertiesFile = rootProject.file("key.properties")\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
          }
          }' "$APPGRADLE"
            sed -i '/^android {/a\
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties["keyAlias"]\
                      keyPassword keystoreProperties["keyPassword"]\
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\
                      storePassword keystoreProperties["storePassword"]\
                  }\
              }' "$APPGRADLE"
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' "$APPGRADLE"
          fi
          echo "----- $APPGRADLE (after signing patch) -----"; cat "$APPGRADLE"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: law-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
