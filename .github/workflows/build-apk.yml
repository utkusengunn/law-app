name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate a fresh Android scaffold matching this Flutter version
        run: |
          flutter create --platforms=android --project-name=law_app --org=com.utkusengun /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          echo "===== android/ tree (diagnostic) ====="
          find android -maxdepth 4 -type f | sort
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="law_app"/android:label="Avukat Asistan"/' "$MANIFEST"
          else
            echo "UYARI: $MANIFEST bulunamadı, label değiştirilemedi."
          fi

      - name: Apply Firebase configuration to the fresh scaffold
        run: |
          cp firebase/google-services.json android/app/google-services.json

          if [ -f android/settings.gradle.kts ]; then
            echo "Tespit: Kotlin DSL (settings.gradle.kts) kullanılıyor."
            SETTINGS=android/settings.gradle.kts
            sed -i '/org.jetbrains.kotlin.android/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS"
          elif [ -f android/settings.gradle ]; then
            echo "Tespit: Groovy DSL (settings.gradle) kullanılıyor."
            SETTINGS=android/settings.gradle
            sed -i '/org.jetbrains.kotlin.android/a\    id "com.google.gms.google-services" version "4.4.2" apply false' "$SETTINGS"
          else
            echo "HATA: ne settings.gradle ne de settings.gradle.kts bulundu."
            echo "===== android/ tam liste ====="
            find android -type f | sort
            exit 1
          fi

          if [ -f android/app/build.gradle.kts ]; then
            APPGRADLE=android/app/build.gradle.kts
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id("com.google.gms.google-services")' "$APPGRADLE"
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APPGRADLE"
            # `flutter create --project-name=law_app --org=com.utkusengun` bakes
            # applicationId "com.utkusengun.law_app" (with the underscore) - but
            # the Firebase project (and google-services.json) was registered
            # for "com.utkusengun.lawapp" (no underscore). Force it to match.
            sed -i -E 's/applicationId[[:space:]]*=[[:space:]]*"com\.utkusengun\.law_app"/applicationId = "com.utkusengun.lawapp"/' "$APPGRADLE"
          elif [ -f android/app/build.gradle ]; then
            APPGRADLE=android/app/build.gradle
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id "com.google.gms.google-services"' "$APPGRADLE"
            sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$APPGRADLE"
            sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"com\.utkusengun\.law_app"/applicationId "com.utkusengun.lawapp"/' "$APPGRADLE"
          else
            echo "HATA: ne app/build.gradle ne de app/build.gradle.kts bulundu."
            exit 1
          fi
          echo "----- $APPGRADLE applicationId satırı -----"; grep -n applicationId "$APPGRADLE"

          echo "IS_KTS=$([ -f android/app/build.gradle.kts ] && echo true || echo false)" >> "$GITHUB_ENV"
          echo "----- $SETTINGS -----"; cat "$SETTINGS"
          echo "----- $APPGRADLE -----"; cat "$APPGRADLE"

      - name: Configure consistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          echo "----- keystore dosya boyutu (bayt) -----"
          wc -c < android/app/release-keystore.jks
          echo "----- keystore + şifre doğrulaması (hızlı test) -----"
          if ! keytool -list -keystore android/app/release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "HATA: keystore/şifre/alias uyuşmuyor. GitHub Secrets'taki ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD veya ANDROID_KEY_ALIAS değerlerinden biri yanlış kopyalanmış olabilir."
            keytool -list -keystore android/app/release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || true
            exit 1
          fi
          echo "OK: keystore ve şifre eşleşiyor."
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

          if [ "$IS_KTS" = "true" ]; then
            APPGRADLE=android/app/build.gradle.kts
            # Imports are allowed before the plugins {} block (Gradle's only
            # rule is that plugins {} must be the FIRST block, not the first
            # line), so put ours at the very top of the file.
            sed -i '1i import java.util.Properties\nimport java.io.FileInputStream' "$APPGRADLE"
            # Load key.properties. The loading code itself must go AFTER the
            # plugins {} block, so insert right after its closing brace - the
            # first standalone "}" line following our two new import lines.
            sed -i '0,/^}/{/^}/a\
          val keystoreProperties = Properties()\
          val keystorePropertiesFile = rootProject.file("key.properties")\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))\
          }
          }' "$APPGRADLE"
            sed -i '/^android {/a\
              signingConfigs {\
                  create("release") {\
                      keyAlias = keystoreProperties.getProperty("keyAlias")\
                      keyPassword = keystoreProperties.getProperty("keyPassword")\
                      storeFile = file(keystoreProperties.getProperty("storeFile"))\
                      storePassword = keystoreProperties.getProperty("storePassword")\
                  }\
              }' "$APPGRADLE"
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$APPGRADLE"
          else
            APPGRADLE=android/app/build.gradle
            sed -i '0,/^}/{/^}/a\
          def keystoreProperties = new Properties()\
          def keystorePropertiesFile = rootProject.file("key.properties")\
          if (keystorePropertiesFile.exists()) {\
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
          }
          }' "$APPGRADLE"
            sed -i '/^android {/a\
              signingConfigs {\
                  release {\
                      keyAlias keystoreProperties["keyAlias"]\
                      keyPassword keystoreProperties["keyPassword"]\
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\
                      storePassword keystoreProperties["storePassword"]\
                  }\
              }' "$APPGRADLE"
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' "$APPGRADLE"
          fi
          echo "----- $APPGRADLE (after signing patch) -----"; cat "$APPGRADLE"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: law-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
