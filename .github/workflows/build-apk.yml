name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate a fresh Android scaffold matching this Flutter version
        run: |
          flutter create --platforms=android --project-name=law_app --org=com.utkusengun /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          sed -i 's/android:label="law_app"/android:label="Avukat Asistan"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: law-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
