name: law_app
description: "Avukat Asistan - offline dava ve müvekkil takip uygulaması"
publish_to: 'none'
version: 0.8.0+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  intl: ^0.20.3
  uuid: ^4.4.0
  table_calendar: ^3.1.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  share_plus: ^7.2.2
  # Tevkil eden kişi seçiminde telefon rehberinden isim seçebilmek için
  # (kullanıcı talebi, 2026-09-08, backlog D015.6). Sadece sistemin kendi
  # rehber seçme ekranını (openExternalPick) kullanıyoruz - bu yöntem
  # READ_CONTACTS izni GEREKTİRMEZ (izin isteyen tam rehber okuma API'leri
  # kullanılmadı, bilinçli tercih: hem kullanıcı için daha az izin isteği
  # hem de CI'da android/ klasörünün her build'de sıfırdan üretilmesi
  # yüzünden manifest'e elle izin eklemekten kaçınmak - bkz. D003.2).
  flutter_contacts: ^1.1.9+2
  # Tevkil sahibi avukat ve müvekkil için doğrudan arama/WhatsApp açma
  # (kullanıcı talebi, 2026-09-08, backlog D015.7).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
